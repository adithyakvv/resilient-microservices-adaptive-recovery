apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adaptive-recovery-grafana-data
  namespace: resilient-microservices-adaptive-recovery
  labels:
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: adaptive-recovery-grafana
  namespace: resilient-microservices-adaptive-recovery
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptive-recovery-grafana
  namespace: resilient-microservices-adaptive-recovery
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
              subPath: datasources.yaml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards/dashboard.json
              subPath: dashboard.json
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: adaptive-recovery-grafana-data
        - name: provisioning
          configMap:
            name: adaptive-recovery-grafana-provisioning
        - name: dashboard
          configMap:
            name: adaptive-recovery-grafana-dashboard
