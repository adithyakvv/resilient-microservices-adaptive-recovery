apiVersion: v1
kind: Secret
metadata:
  name: adaptive-recovery-engine-scrape
  namespace: resilient-microservices-adaptive-recovery
type: Opaque
stringData:
  prometheus-additional.yaml: |
    - job_name: adaptive-recovery-engine-e2
      metrics_path: /api/recovery/e2/metrics
      static_configs:
        - targets: ["host.docker.internal:8090"]
          labels:
            project: resilient-microservices-adaptive-recovery
            source: recovery-engine
    - job_name: adaptive-recovery-engine-e3
      metrics_path: /api/recovery/e3/metrics
      static_configs:
        - targets: ["host.docker.internal:8090"]
          labels:
            project: resilient-microservices-adaptive-recovery
            source: recovery-engine
