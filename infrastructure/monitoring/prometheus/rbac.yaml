apiVersion: v1
kind: ServiceAccount
metadata:
  name: adaptive-recovery-prometheus
  namespace: resilient-microservices-adaptive-recovery
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: adaptive-recovery
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adaptive-recovery-prometheus-discovery
  namespace: resilient-microservices-adaptive-recovery
  labels:
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
rules:
  - apiGroups:
      - ""
    resources:
      - endpoints
      - pods
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - discovery.k8s.io
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adaptive-recovery-prometheus-discovery
  namespace: resilient-microservices-adaptive-recovery
  labels:
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: adaptive-recovery-prometheus-discovery
subjects:
  - kind: ServiceAccount
    name: adaptive-recovery-prometheus
    namespace: resilient-microservices-adaptive-recovery
