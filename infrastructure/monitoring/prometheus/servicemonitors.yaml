apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: adaptive-services
  namespace: resilient-microservices-adaptive-recovery
  labels:
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
spec:
  selector:
    matchLabels:
      monitoring: "true"
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 10s
