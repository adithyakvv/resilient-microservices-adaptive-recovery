apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: resilient-microservices-adaptive-recovery
resources:
  - rbac.yaml
  - prometheus.yaml
  - service.yaml
  - servicemonitors.yaml
  - e2-engine-scrape-secret.yaml
  - grafana.yaml
configMapGenerator:
  - name: adaptive-recovery-grafana-dashboard
    files:
      - dashboard.json=grafana-dashboard.json
  - name: adaptive-recovery-grafana-provisioning
    files:
      - datasources.yaml=grafana-datasources.yaml
      - dashboards.yaml=grafana-dashboards.yaml
generatorOptions:
  disableNameSuffixHash: true
