apiVersion: v1
kind: Service
metadata:
  name: adaptive-order-service
  labels:
    app.kubernetes.io/name: adaptive-order-service
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
    monitoring: "true"
spec:
  selector:
    app.kubernetes.io/name: adaptive-order-service
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptive-order-service
  labels:
    app.kubernetes.io/name: adaptive-order-service
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adaptive-order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adaptive-order-service
        app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
    spec:
      containers:
        - name: adaptive-order-service
          image: localhost:30500/adaptive-order-service:phase3b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8083
          env:
            - name: DB_URL
              value: jdbc:postgresql://adaptive-postgres:5432/resilient_microservices_adaptive_recovery
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: adaptive-postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: adaptive-postgres-credentials
                  key: password
            - name: PRODUCT_SERVICE_URL
              value: http://adaptive-product-service:8081
            - name: INVENTORY_SERVICE_URL
              value: http://adaptive-inventory-service:8082
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
