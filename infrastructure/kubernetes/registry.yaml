apiVersion: v1
kind: Service
metadata:
  name: adaptive-image-registry
  labels:
    app.kubernetes.io/name: adaptive-image-registry
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: adaptive-image-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      nodePort: 30500
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adaptive-image-registry
  labels:
    app.kubernetes.io/name: adaptive-image-registry
    app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: adaptive-image-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adaptive-image-registry
        app.kubernetes.io/part-of: resilient-microservices-adaptive-recovery
    spec:
      containers:
        - name: registry
          image: registry:3.0.0
          ports:
            - name: registry
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /v2/
              port: registry
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
